<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080e">
<title>NEXUS · Reconnecting</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#11283c 0,#060b12 60%,#04070c 100%);color:#dce8f1;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.core{position:relative;width:150px;height:150px;margin:0 auto 34px}
.core i{position:absolute;inset:0;border:1px solid #8fd3ff55;border-radius:50%;animation:pulse 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.core i:nth-child(2){animation-delay:.85s}.core i:nth-child(3){animation-delay:1.7s}
.core b{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#e6f7ff,#7cc6f2 45%,#7cc6f200 72%);box-shadow:0 0 60px #7cc6f2aa;animation:beat 1.3s ease-in-out infinite}
@keyframes pulse{from{transform:scale(.35);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes beat{50%{transform:scale(1.18)}}
main{text-align:center;padding:24px;max-width:460px}
small{font:11px/1 Consolas,monospace;letter-spacing:.24em;color:#8fb5cf}
h1{font-weight:300;font-size:30px;letter-spacing:-.02em;margin:16px 0 12px}
p{color:#9cb2c4;line-height:1.7;font-size:15px;margin:0 0 22px}
button{font:inherit;font-size:13px;color:#d9efff;background:#12304a99;border:1px solid #8fd3ff55;border-radius:8px;padding:11px 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.core i,.core b{animation:none}}
</style>
</head>
<body>
<main>
  <div class="core" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <small>NEXUS ENGINE OFFLINE</small>
  <h1>Waiting for the spatial engine.</h1>
  <p>Open NEXUS from its desktop shortcut (or double-click <b>Start NEXUS</b> in the NEXUS folder). This window reconnects by itself as soon as the engine is up.</p>
  <button onclick="location.reload()">Retry now</button>
</main>
<script>
setInterval(function(){fetch('/api/ai/status',{cache:'no-store'}).then(function(r){if(r.status<500)location.reload()}).catch(function(){})},3000);
</script>
</body>
</html>
