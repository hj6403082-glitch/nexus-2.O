[project]
name = "zeno-brain"
version = "0.1.0"
description = "Zeno's native brain: inference, memory, senses and agentic tool use."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not slow'"
# A hung socket or thread must fail the test, not stall the suite.
timeout = 30
markers = [
    "slow: needs a real GGUF model or other heavy resources; run with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]
# The command-policy tests name dangerous paths and commands on purpose; nothing runs
"tests/linux/test_command_policy.py" = ["S101", "S108"]
# dbus-fast reads D-Bus signatures from string annotations such as "s" and "a{sv}"
"tests/linux/test_dbus_integration.py" = ["S101", "F821", "F722"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["zeno"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "chromadb.*", "icmplib.*", "winrt.*"]
ignore_missing_imports = true
