[project]
name = "zeno-brain"
version = "0.1.0"
description = "Zeno's native brain: inference, memory, senses and agentic tool use."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: needs a real GGUF model or other heavy resources; run with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["zeno"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "chromadb.*"]
ignore_missing_imports = true
